name: Production Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: muebledesk_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, curl, fileinfo, pdo_mysql, bcmath, intl
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit production dependencies
        run: composer audit --locked --no-dev

      - name: Prepare application
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          php artisan key:generate
          npm ci
          npm run build
        env:
          APP_ENV: testing

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run migrations and tests
        run: |
          php artisan migrate --force
          ./vendor/bin/phpunit --configuration phpunit.xml
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: muebledesk_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

      - name: Verify production caches and scheduler
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          php artisan route:cache
          php artisan config:cache
          php artisan view:cache
          php artisan schedule:list
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: muebledesk_test
          DB_USERNAME: root
          DB_PASSWORD: root
